name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.so }}

    # bash nos tres sistemas: no Windows o shell padrao e o PowerShell, e ele
    # desmonta "-Dexec.args=..." em dois argumentos antes de o Maven ver.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Testes
        run: mvn -B -ntp verify

      - name: todo agendamento dispara na mesma ordem
        run: mvn -B -ntp -q exec:java -Dexec.args="correcao"

      - name: o custo por tique com o sistema ocioso
        run: mvn -B -ntp -q exec:java -Dexec.args="ociosidade"

      - name: o custo por evento agendado
        run: mvn -B -ntp -q exec:java -Dexec.args="carga"

      - name: o que o horizonte faz com a roda
        run: mvn -B -ntp -q exec:java -Dexec.args="horizonte"

      - name: o custo de cancelar
        run: mvn -B -ntp -q exec:java -Dexec.args="cancelamento"

      - name: Relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.so }}
          path: target/surefire-reports
